<div class="register-container">
  <app-nav-bar></app-nav-bar>
  <div class="register-card">
    <div class="top-bar">
      <span class="login-text">
        Already registered?
        <a href="/login" class="login-link">Login to your account</a>
      </span>
    </div>

    <div class="register-content">
      <h2 class="welcome-text">Welcome! 👋</h2>
      <h1 class="register-title">Create your account</h1>

      <form >
        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            placeholder="John Doe"
            class="form-control"
          />
          <div *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid"
               class="error-message">
            <span *ngIf="registerForm.get('name')?.errors?.['required']">Name is required</span>
          </div>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input
            type="text"
            id="cpf"
            formControlName="cpf"
            placeholder="000.000.000-00"
            class="form-control"
            maxlength="14"
          />
          <div *ngIf="registerForm.get('cpf')?.touched && registerForm.get('cpf')?.invalid"
               class="error-message">
            <span *ngIf="registerForm.get('cpf')?.errors?.['required']">CPF is required</span>
            <span *ngIf="registerForm.get('cpf')?.errors?.['invalidCpf']">Invalid CPF format</span>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="johndoe@gmail.com"
            class="form-control"
          />
          <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
               class="error-message">
            <span *ngIf="registerForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="registerForm.get('email')?.errors?.['email']">Invalid email format</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="Enter password"
              class="form-control"
            />
            <button type="button" class="toggle-password" >
              <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
          </div>
          <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
               class="error-message">
            <span *ngIf="registerForm.get('password')?.errors?.['required']">Password is required</span>
            <span *ngIf="registerForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Repeat Password</label>
          <div class="password-input-container">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Repeat password"
              class="form-control"
            />
            <button type="button" class="toggle-password" >
              <i class="fas" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword"></i>
            </button>
          </div>
          <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.errors?.['passwordMismatch']"
               class="error-message">
            Passwords do not match
          </div>
        </div>

        <button type="submit" class="register-button" [disabled]="false">
          Create Account
        </button>
      </form>
    </div>
  </div>
</div>
