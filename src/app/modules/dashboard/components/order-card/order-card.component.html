<div class="purchase-date">{{ purchase.date }}</div>
<div class="purchase-card">
  <div class="purchase-info">
    <div class="purchase-details">
      <div class="status">
        <span class="status-label">{{ purchase.status }}</span>
        <span class="delivery-date">
          Você retirou no dia {{ purchase.deliveryDate }}
          <i class="bi bi-lightning-charge-fill"></i>
        </span>
      </div>
      <div class="product-name">{{ purchase.product.name }}</div>
      <div class="quantity">{{ purchase.product.quantity }}</div>
    </div>
  </div>

  <div class="purchase-actions">
    <div class="seller">Entregar para</div>
    <a href="#" class="message-link">Roberto chaves Souza</a>
    <div class="buttons">
      <button class="primary-button">Avaliar entrega</button>
      <button class="secondary-button">Falar sobre Entrega</button>
    </div>
  </div>
</div>
